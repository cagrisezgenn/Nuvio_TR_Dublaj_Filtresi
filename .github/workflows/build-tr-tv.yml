name: Build Nuvio TR Android TV (debug APK)

on:
  workflow_dispatch:
  push:
    branches:
      - feat/android-tv-v1

permissions:
  contents: read

jobs:
  tv:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download TV patch and official NuvioTV dev source
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --connect-timeout 20 --max-time 360 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            -o "$RUNNER_TEMP/nuvio-tr-tv.tar.gz"
          tar xzf "$RUNNER_TEMP/nuvio-tr-tv.tar.gz" -C "$GITHUB_WORKSPACE" --strip-components=1
          mkdir -p "$GITHUB_WORKSPACE/tv-upstream"
          curl -fL --retry 4 --connect-timeout 20 --max-time 360 \
            "https://codeload.github.com/NuvioMedia/NuvioTV/tar.gz/refs/heads/dev" \
            -o "$RUNNER_TEMP/nuviotv-source.tar.gz"
          tar xzf "$RUNNER_TEMP/nuviotv-source.tar.gz" -C "$GITHUB_WORKSPACE/tv-upstream" --strip-components=1
          test -f tv-upstream/gradlew
          test -f tv/install_tv.py

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
          cache-dependency-path: |
            tv-upstream/gradle/wrapper/gradle-wrapper.properties
            tv-upstream/**/*.gradle.kts

      - name: Patch Android TV screens and source presets
        shell: bash
        run: |
          set -euo pipefail
          python3 tv/install_tv.py tv-upstream --check
          python3 tv/install_tv.py tv-upstream
          grep -q 'com.cagrisezgen.nuviotv.tr' tv-upstream/app/build.gradle.kts
          grep -q 'TvDubFocusBar' tv-upstream/app/src/main/java/com/nuvio/tv/ui/screens/stream/StreamScreen.kt

      - name: Generate isolated CI debug signing key
        shell: bash
        run: |
          set -euo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/nuvio-tr-tv-debug.jks" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=TV Debug,O=Android,C=US"
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/nuvio-tr-tv-debug.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=androiddebugkey"
            echo "NUVIO_RELEASE_KEY_PASSWORD=android"
            echo "NUVIO_RELEASE_STORE_PASSWORD=android"
          } >> "$GITHUB_ENV"
          echo "sdk.dir=$ANDROID_HOME" > tv-upstream/local.properties

      - name: Build TV full debug APK
        shell: bash
        working-directory: tv-upstream
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :app:assembleFullDebug --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/tv-gradle.log"

      - name: Upload TV APK
        uses: actions/upload-artifact@v6
        with:
          name: Nuvio-TR-TV-debug-APK
          path: tv-upstream/app/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload build failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: Nuvio-TR-TV-build-log
          path: tv-gradle.log
          if-no-files-found: ignore
          retention-days: 7
