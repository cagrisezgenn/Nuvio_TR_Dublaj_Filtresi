name: Build Nuvio TR Dublaj (debug APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash

    steps:
      # Source archives contain tracked files but no .git directory.
      # In particular, this prevents Git/submodule operations against
      # upstream's libass-android gitlink, which lacks a .gitmodules URL.
      - name: Download filter and Nuvio source archives (no git checkout)
        run: |
          set -euo pipefail
          echo "Filter repository: $GITHUB_REPOSITORY at $GITHUB_SHA"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 \
            --max-time 300 \
            "https://codeload.github.com/${GITHUB_REPOSITORY}/tar.gz/${GITHUB_SHA}" \
            --output "$RUNNER_TEMP/tr-dub-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/tr-dub-source.tar.gz" \
            -C "$GITHUB_WORKSPACE" --strip-components=1

          echo 'Downloading official NuvioMobile cmp-rewrite branch...'
          mkdir -p "$GITHUB_WORKSPACE/nuvio-upstream"
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 \
            --max-time 300 \
            "https://codeload.github.com/NuvioMedia/NuvioMobile/tar.gz/refs/heads/cmp-rewrite" \
            --output "$RUNNER_TEMP/nuvio-source.tar.gz"
          tar -xzf "$RUNNER_TEMP/nuvio-source.tar.gz" \
            -C "$GITHUB_WORKSPACE/nuvio-upstream" --strip-components=1
          test -f "$GITHUB_WORKSPACE/scripts/install_filter.py"
          test -f "$GITHUB_WORKSPACE/nuvio-upstream/gradlew"
          echo 'Both source snapshots downloaded. No git clone/checkout/submodule update executed.'

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            nuvio-upstream/gradle/wrapper/gradle-wrapper.properties
            nuvio-upstream/**/*.gradle.kts

      - name: Check Android build environment
        run: |
          set -euo pipefail
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?ANDROID_HOME is not set}"

      - name: Validate and apply Turkish dub filter
        run: |
          set -euo pipefail
          python3 scripts/install_filter.py nuvio-upstream --check
          python3 scripts/install_filter.py nuvio-upstream

      - name: Build Android debug APK
        working-directory: nuvio-upstream
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug --stacktrace --console=plain \
            2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: Nuvio-TR-Dublaj-debug-APK
          path: nuvio-upstream/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
