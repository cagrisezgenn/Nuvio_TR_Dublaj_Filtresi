name: Build Nuvio TR Dublaj (debug APK)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Check out filter package
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Check out official Nuvio Mobile (without submodules)
        uses: actions/checkout@v5
        with:
          repository: NuvioMedia/NuvioMobile
          ref: cmp-rewrite
          path: nuvio-upstream
          submodules: false
          persist-credentials: false

      # MPVKit is an Apple-platform library and is not needed for Android.
      # Never run git submodule update here: upstream has a gitlink for
      # libass-android without a corresponding .gitmodules URL.
      - name: Check source directories
        run: |
          test -f nuvio-upstream/gradlew
          test -f scripts/install_filter.py
          echo "Nuvio source and filter patch are present."

      - name: Install JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            nuvio-upstream/gradle/wrapper/gradle-wrapper.properties
            nuvio-upstream/**/*.gradle.kts

      # ubuntu-24.04 GitHub-hosted runners already include the Android SDK.
      - name: Show build environment
        run: |
          java -version
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          test -d "${ANDROID_HOME:?ANDROID_HOME is not set}"

      - name: Validate upstream and apply Turkish dub filter
        run: |
          python3 scripts/install_filter.py nuvio-upstream --check
          python3 scripts/install_filter.py nuvio-upstream

      - name: Build separate-install Android debug APK
        working-directory: nuvio-upstream
        shell: bash
        run: |
          set -o pipefail
          chmod +x ./gradlew
          ./gradlew :androidApp:assembleFullDebug --stacktrace --console=plain 2>&1 | tee "$GITHUB_WORKSPACE/gradle-build.log"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-TR-Dublaj-debug-APK
          path: nuvio-upstream/androidApp/build/outputs/apk/full/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Gradle failure log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-build-log
          path: gradle-build.log
          if-no-files-found: ignore
          retention-days: 7
